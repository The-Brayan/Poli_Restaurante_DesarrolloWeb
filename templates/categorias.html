<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías - PoliRestaurante</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; }
        header { background: #17365d; color: white; text-align: center; padding: 20px; }
        .contenedor { max-width: 800px; margin: 35px auto; padding: 25px; background: white; border-radius: 12px; }
        h2 { color: #17365d; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: #17365d; color: white; }
        .boton { display: inline-block; padding: 10px 14px; margin: 4px; background: #17365d; color: white; text-decoration: none; border: 0; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
<header>
    <h1>PoliRestaurante</h1>
    <p>Administración de categorías</p>
</header>

<div class="contenedor">
    <h2>Lista de categorías</h2>

    <a class="boton" href="{{ url_for('agregar_categoria') }}">
        + Agregar categoría
    </a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
        {% for categoria in categorias %}
            <tr>
                <td>{{ categoria.id_categoria }}</td>
                <td>{{ categoria.nombre }}</td>
                <td>
                    <a class="boton"
                       href="{{ url_for('editar_categoria',
                       id_categoria=categoria.id_categoria) }}">
                        Editar
                    </a>

                    <form action="{{ url_for('eliminar_categoria',
                    id_categoria=categoria.id_categoria) }}"
                    method="POST" style="display:inline"
                    onsubmit="return confirm('¿Eliminar esta categoría?');">
                        <button class="boton" type="submit">
                            Eliminar
                        </button>
                    </form>
                </td>
            </tr>
        {% else %}
            <tr>
                <td colspan="3">No hay categorías registradas.</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>

    <p><a href="{{ url_for('index') }}">← Volver al inicio</a></p>
</div>
</body>
</html>
