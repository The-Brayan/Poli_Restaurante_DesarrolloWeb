
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar categoría - PoliRestaurante</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }
        header {
            background: #17365d;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .contenedor {
            max-width: 500px;
            margin: 35px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
        }
        h2 { color: #17365d; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .boton {
            padding: 10px 14px;
            background: #17365d;
            color: white;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>PoliRestaurante</h1>
        <p>Administración de categorías</p>
    </header>

    <div class="contenedor">
        <h2>Agregar categoría</h2>

        <form method="POST" action="{{ url_for('agregar_categoria') }}">
            <label for="nombre">Nombre de la categoría</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                required
            >

            <button class="boton" type="submit">
                Guardar categoría
            </button>
        </form>

        <p>
            <a href="{{ url_for('categorias_web') }}">
                ← Volver a categorías
            </a>
        </p>
    </div>
</body>
</html>
